services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ruanjianbei-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env   # ⭐ 指定 backend 目录下的 .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:///data/app.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ruanjianbei-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
    driver: local